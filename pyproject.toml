[project]
name = "mangascan"
version = "0.1.0"
description = "Manga Translator NAS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.25.0",
    "img2pdf>=0.5.0",
    "requests>=2.32.0",
    "Pillow>=11.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.8.0",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
